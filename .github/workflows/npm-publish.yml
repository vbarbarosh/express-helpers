# Publishes the package when a release tag is pushed
# (bin/release creates and pushes the tag).
#
# Authenticates via npm Trusted Publishing (OIDC) — no token/secret involved.
# The trusted publisher is configured in the package settings on npmjs.com:
# GitHub Actions, vbarbarosh/express-helpers, workflow npm-publish.yml.

name: npm publish

on:
  push:
    tags: [ "v*" ]

jobs:
  publish:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC)

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org'
    # Trusted Publishing requires npm >= 11.5.1; node 22 bundles npm 10
    - run: npm install -g npm@latest
    - run: npm ci
    - name: Check tag matches package version
      run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
    - run: npm run lint
    - run: npm test
    - run: npm publish --access public
